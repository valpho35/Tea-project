<h2 class="title mb-5 mt-5 text-center">Наши чайные коллекции</h2>
<div class="container">
    <div class="row g-4">
        <div *ngFor="let item of catalogItems" class="col-lg-4 col-md-6">
            <div class="card wow animate__zoomIn h-100 border-0 shadow-sm">
                <a [href]="item.imageBig" class="card-img-top p-3">
                    <img [src]="item.image" 
                         [alt]="item.title"
                         class="img-fluid rounded">
                </a>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-primary">{{ item.title }}</h5>
                    <p class="card-text flex-grow-1">{{ item.description }}</p>
                    
                    <div class="mt-3">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="h5 text-success mb-0">{{ formatPrice(item.price) }}</span>
                        </div>
                        
                        <button class="btn btn-primary w-100" 
                                [routerLink]="['/product', item.id]">
                            <i class="bi bi-info-circle me-2"></i>
                            Подробнее
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
