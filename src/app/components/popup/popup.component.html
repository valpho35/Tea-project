<div class="popup-overlay" *ngIf="isVisible">
    <div class="popup-content animate__animated animate__bounceIn">
        <div class="card shadow-lg" style="width: 24rem;">
            <div class="card-body text-center p-4">
                <h5 class="card-title mb-3 text-primary">
                    <i class="bi bi-cup-hot me-2"></i>
                    Посмотрите наши чайные коллекции
                </h5>
                <p class="card-text mb-4">
                    Откройте для себя уникальные сорта чая со всего мира!
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <button class="btn btn-primary px-4" (click)="goToCatalog()">
                        <i class="bi bi-eye me-2"></i>Смотреть
                    </button>
                    <button class="btn btn-outline-secondary" (click)="close()">
                        Закрыть
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
